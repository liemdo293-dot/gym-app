<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Gym</title>

  <!-- Farbschema sofort setzen, damit nichts aufblitzt -->
  <script>
    try {
      const modus = (JSON.parse(localStorage.getItem("gym-einstellungen")) || {}).theme || "dunkel";
      const hell = modus === "hell" || (modus === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = hell ? "light" : "dark";
    } catch (fehler) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <!-- Als App installierbar -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="bilder/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="bilder/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <!-- basis.css = gemeinsames Design wie beim Lernbegleiter, gym.css = alles Gym-Eigene -->
  <link rel="stylesheet" href="css/basis.css">
  <link rel="stylesheet" href="css/gym.css">
</head>
<body>
  <div class="app">
    <main class="ansichten">
      <section class="ansicht" id="ansicht-heute" data-ansicht="heute"></section>
      <section class="ansicht" id="ansicht-plan" data-ansicht="plan"></section>
      <section class="ansicht" id="ansicht-coach" data-ansicht="coach"></section>
      <section class="ansicht" id="ansicht-fortschritt" data-ansicht="fortschritt"></section>
      <section class="ansicht" id="ansicht-rang" data-ansicht="rang"></section>
    </main>

    <!-- Seite, die von rechts hereingleitet (Übung, Einstellungen) -->
    <section class="detail" id="detail" aria-hidden="true"></section>

    <!-- Fenster von unten -->
    <div class="sheet-hintergrund" id="sheet-hintergrund" data-aktion="sheet-zu"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></section>

    <!-- Das laufende Training im Vollbild -->
    <section class="training" id="training" role="dialog" aria-modal="true" aria-label="Training" aria-hidden="true"></section>

    <!-- Erster Start: Fragebogen für den Trainingsplan -->
    <section class="start" id="start" role="dialog" aria-modal="true" aria-label="Plan erstellen" aria-hidden="true"></section>

    <input type="file" id="backup-datei" accept=".json,application/json" hidden>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <span class="tabbar-indikator"></span>
      <button class="tab" data-ziel="heute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        Heute
      </button>
      <button class="tab" data-ziel="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        Plan
      </button>
      <button class="tab" data-ziel="coach">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
        Coach
      </button>
      <button class="tab" data-ziel="fortschritt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5.5-6 4 3.5L20 8"/><path d="M15 8h5v5"/></svg>
        Fortschritt
      </button>
      <button class="tab" data-ziel="rang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
        Rang
      </button>
    </nav>
  </div>

  <script src="js/uebungen.js"></script>
  <script src="js/logik.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Offline-Speicher – nur wenn die App aus dem Internet oder vom lokalen Server kommt
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
